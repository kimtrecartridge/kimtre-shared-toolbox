      em_h: 'Tonearm effective mass (from moment of inertia)', em_sub: 'Weigh the parts, measure two distances, and the program reduces everything to the stylus. The result is used for the resonance section when the two effective-mass fields above are left blank. A blank factor field takes the default shown in the field.', em_L: 'Effective length L: pivot to stylus (mm)', em_cwm: 'Counterweight: mass (g)', em_cwr: 'Counterweight: pivot to weight centre when balanced (mm)', em_tw: 'Bare tube: scale reading at the front end, rear end resting at the pivot (g)', em_ts: 'Bare tube: pivot to scale support point (mm), blank = L', em_tk: 'Tube factor (0.667 = uniform tube; up to 1 = mass concentrated at the front end)', em_hm0: 'Reference: headshell and screws mass when the weight position was measured (g)', em_cm0: 'Reference: cartridge mass when the weight position was measured (g)', em_ref: 'Take the headshell and cartridge masses above as the reference', em_ref_s: 'Measure the counterweight position once, then press Take as reference (or fill the two Reference fields). Later, when you change the headshell or the cartridge, only edit the mass in the Headshell and Cartridge fields above: the counterweight position is worked out again from the balance about the pivot, with no new measuring. With the Reference fields left blank the measured position is used as it is.', em_b_cwr: 'position re-derived from balance:', em_shift_n: 'The counterweight position is not measured again but worked out from the moment balance about the pivot, from the reference that was measured (headshell and cartridge mass when the position was measured). It is an approximation: the tube behind the pivot and any change of tracking force are ignored. Change the counterweight, the tube, or move the cartridge in the headshell slots, and measure again with a new reference.', em_shift_bad: 'The recalculated weight position is no longer plausible (below 0), so the program uses the measured figure. Measure  assumption; mass gathered at the collet and connector pushes the factor towards 1, and the true value lies between the two.', em_w3: 'Headshell: M = m·(x/L)², x being the pivot to centre of mass distance. A factor of 0.85 corresponds to a centre of mass about 18 mm behind the stylus when L = 230 mm; that is an assumption taken from an estimate, not measured. Balance the headshell on a knife edge, enter the set-back in the field above, and the factor is then calculated in place of 0.85.', em_w4: 'Cartridge: a factor of 1 takes the whole mass at the stylus. The real centre of mass sits a few mm to about ten mm behind the stylus, so the true factor is about 0.9 to 1; the figure 1 leans a little high.', em_w5: 'This gives the lateral effective mass (vertical pivot axis). For a gimbal bearing the vertical figure is about the same; if a separate figure exists, enter it in the vertical effective-mass field.', tr_em_arm: 'arm + headshell', tr_em_cart: 'cartridge', tr_em_fac: 'tube factor', tr_em_hs: 'headshell', tr_em_cc: 'cartridge', tr_em_asm: 'assumed', nm_em: 'Effective mass', ds_vtf_f: 'VTF (g)', ds_ts_h: 'Tracking by tracking force', ds_c_disc: 'Disc', ds_c_vtf: 'VTF (g)', ds_ts_best: 'highest level', ds_ts_from: 'reached from the lowest VTF of', ds_ts_note: 'Each line is one disc at one tracking force; the force is set for each file where the tracking files are loaded, and left blank it takes the tracking-section force, then the force in the equipment chain.', nm_trs: 'Tracking by VTF', nm_g_in: 'Load and measure', nm_g_oth: 'Other', nm_g_vl: 'Voltage', nm_g_ds: 'Test disc', nm_g_mt: 'Method', rc_h: 'Report content', rc_s: 'Choose which blocks go into the exported report (the screen still shows everything). Two ready-made sets below.', rc_resp: 'Response chart', rc_xt: 'Crosstalk chart', rc_hm: 'Harmonics chart', rc_key: 'Key points table', rc_chain: 'Equipment chain', rc_bal: 'Channel balance (chart and conclusion)', rc_sep: 'Channel separation', rc_vlt: 'Voltage',       print: 'Print', svg: 'Save SVG', csv: 'Save CSV', png: 'Export PNG images', html: 'Export HTML report', vl_sc: 'Reference from an external measurement (oscilloscope)', vl_sc_h: 'Oscilloscope reference', vl_sc_sub: 'Measure the real voltage with the oscilloscope at the phono stage output (after the phono stage) while the 1 kHz 3.54 cm/s track plays, then record that same signal through the same chain into a file. Drop the recording, enter the voltage read on channel 1 (left) and channel 2 (right), the phono stage gain and a note. The cartridge voltage of the reference is the measured voltage divided by the gain. Files of other cartridges recorded through the same chain at the same gain only need to be dropped in the cartridge list: leave the gain empty to use the reference gain. A reference can be saved for next time.', vl_sc_n: 'Note (e.g. cartridge name, phono stage at highest gain, ADC)', vl_sc_g: 'Phono stage gain', vl_sc_v1: 'Channel 1 (left) at the scope', vl_sc_v2: 'Channel 2 (right)', vl_sc_vscope: 'Voltage at the scope', vl_sc_vcart: 'Cartridge voltage', vl_gain_sc: 'from the reference', vl_sc_code: 'Show the saved reference code', vl_sc_code_n: 'Send this code to embed it permanently in the program: references saved in the browser do not follow to another page or computer.', vl_sc_built: 'built into the program', vl_w_scc: 'The two channels of the reference differ by', vl_sc_add: 'Drop the oscilloscope reference file here, or click to choose', vl_ch_a: 'Stronger channel', vl_ch_m: 'Mean of both channels', vl_sc_save: 'Save', vl_sc_saved: 'References saved in this browser', vl_sc_use: 'Use', vl_sc_none: 'No saved reference yet.', vl_vsc: 'From oscilloscope ref.', vl_w_scf: 'Saved reference was made at a different frequency than the one set:', vl_w_scs: 'The oscilloscope references disagree by',
